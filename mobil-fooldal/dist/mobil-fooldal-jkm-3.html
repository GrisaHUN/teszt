<style>
  @media (max-width: 767px) { html, body { max-width: 100%; overflow-x: hidden; } }
  #jkm-b3 { box-sizing: border-box; position: relative; width: 100vw; max-width: 100vw; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); overflow-x: clip; background: #FFFFFF; padding: 12px 0 44px; text-align: center; }
  #jkm-b3 *, #jkm-b3 *::before, #jkm-b3 *::after { box-sizing: border-box; }
  #jkm-b3 h2 { margin: 0; padding: 0; }

  #jkm-b3.jkm-js .jkm-rv { opacity: 0; transition: opacity 550ms ease-out, transform 550ms ease-out; transition-delay: var(--jkm-d, 0ms); }
  #jkm-b3.jkm-js .jkm-rv-up { transform: translateY(22px); }
  #jkm-b3.jkm-js .jkm-rv-sc { transform: scale(0.9); }
  #jkm-b3.jkm-js .jkm-rv.jkm-in { opacity: 1; transform: none; }

  #jkm-b3 .jkm-kesz-title { font-size: 23px; font-weight: 800; color: #0E1C43; line-height: 1.25; margin: 0 22px 18px; }
  .jkm-kesz-pill { display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(90deg, #E4572E 0%, #C13B5A 32%, #6B4FA0 62%, #1E6FD9 100%); color: #FFFFFF; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 15px; line-height: 1.2; padding: 14px 22px; border-radius: 999px; box-shadow: 0 10px 24px -10px rgba(30,111,217,0.55); }
  .jkm-kesz-pill svg { width: 19px; height: 19px; flex: none; }

  .jkm-brands { margin-top: 30px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%); }
  .jkm-brands-track { display: flex; align-items: center; width: max-content; animation: jkm-marquee 26s linear infinite; }
  .jkm-brands-set { display: flex; align-items: center; flex: none; }
  .jkm-brand { flex: none; height: 60px; margin-right: 30px; display: flex; align-items: center; justify-content: center; }
  .jkm-brand img { display: block; height: 100%; width: auto; max-width: none; object-fit: contain; }
  @keyframes jkm-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .jkm-brands:active .jkm-brands-track { animation-play-state: paused; }

  @media (prefers-reduced-motion: reduce) {
    #jkm-b3.jkm-js .jkm-rv { opacity: 1; transform: none; transition: none; }
    .jkm-brands { -webkit-mask-image: none; mask-image: none; }
    .jkm-brands-track { animation: none; width: auto; justify-content: center; }
    .jkm-brands-set { flex-wrap: wrap; justify-content: center; gap: 14px 0; padding: 0 16px; }
    .jkm-brands-set + .jkm-brands-set { display: none; }
  }
</style>

<script>
(function () {
  if (window.__jkmB3) return;
  window.__jkmB3 = true;
  var root = document.getElementById('jkm-b3');
  if (!root) return;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var track = root.querySelector('.jkm-brands-track');
  var set = root.querySelector('.jkm-brands-set');

    var copy = set.cloneNode(true);
    copy.setAttribute('aria-hidden', 'true');
    copy.querySelectorAll('img').forEach(function (img) { img.alt = ''; });
    track.appendChild(copy);

  var rv = root.querySelectorAll('.jkm-rv');
  if (reduce || !('IntersectionObserver' in window)) {
    rv.forEach(function (el) { el.classList.add('jkm-in'); });

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('jkm-in'); io.unobserve(e.target); }

  }, { threshold: 0.15 });
  rv.forEach(function (el) { io.observe(el); });
